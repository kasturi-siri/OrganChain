apply plugin: 'net.corda.plugins.cordapp'
apply plugin: 'net.corda.plugins.quasar-utils'

cordapp {
    // Must match the platform version in constants.properties
    targetPlatformVersion corda_platform_version
    minimumPlatformVersion corda_platform_version
    workflow {
        name "OrganChain Flows"  // RegisterDonorFlow, RegisterRecipientFlow, OrganMatchingFlow,
                                 // MatchConfirmationFlow, NotifyPartiesFlow, TransportFlow
        vendor "Corda Open Source"
        licence "Apache License, Version 2.0"
        versionId 1              // Increment when flow logic changes
    }
}

sourceSets {
    main {
        resources {
            srcDir rootProject.file("config/dev")
        }
    }
    test {
        resources {
            srcDir rootProject.file("config/test")
        }
    }
    integrationTest {
        kotlin {
            compileClasspath += main.output + test.output
            runtimeClasspath += main.output + test.output
            srcDir file('src/integrationTest/kotlin')
        }
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    // Kotlin standard library
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"

    // Test frameworks
    testImplementation "org.jetbrains.kotlin:kotlin-test:$kotlin_version"
    testImplementation "junit:junit:$junit_version"

    // Corda node API — compile-time only; provided by the Corda node at runtime
    cordaProvided "$corda_core_release_group:corda-core:$corda_core_release_version"
    cordaProvided  "$corda_release_group:corda:$corda_release_version"

    // Test infrastructure — includes MockServices, flow test utilities, and node driver
    testImplementation "$corda_release_group:corda-node-driver:$corda_release_version"
    testImplementation "$corda_core_release_group:corda-core-test-utils:$corda_core_release_version"
    testImplementation "$corda_core_release_group:corda-test-utils:$corda_core_release_version"

    // CorDapp dependency — contracts module contains states and contracts
    cordapp project(":contracts")

    // Snappy is required at test runtime by Corda's checkpointing / serialization
    testRuntimeOnly "org.iq80.snappy:snappy:$snappy_version"
}

task integrationTest(type: Test, dependsOn: []) {
    group = 'verification'
    description = 'Runs integration tests that spin up real Corda nodes via the node driver.'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    jvmArgs = rootProject.ext.test_add_opens + rootProject.ext.test_add_opens_fx
    useJUnit()
}

test {
    description = 'Runs unit tests for workflow flows and services.'
    jvmArgs = rootProject.ext.test_add_opens
}
