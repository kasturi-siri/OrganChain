apply plugin: 'org.springframework.boot'
apply plugin: 'kotlin-spring'
sourceSets {
    main {
        resources {
            srcDir rootProject.file("config/dev")
        }
    }
}

dependencies {
    // Corda dependencies.
    implementation "$corda_core_release_group:corda-core:$corda_core_release_version"
    implementation "$corda_release_group:corda-rpc:$corda_release_version"
    implementation "com.fasterxml.jackson.module:jackson-module-kotlin:2.15.2"
    // CorDapp dependencies.
    implementation project(":contracts")
    implementation project(":workflows")
    implementation("org.springframework.boot:spring-boot-starter-websocket:$spring_boot_version") {
        exclude group: "org.springframework.boot", module: "spring-boot-starter-logging"
    }
    implementation "org.apache.logging.log4j:log4j-slf4j2-impl:${log4j_version}"
    implementation "org.apache.logging.log4j:log4j-web:${log4j_version}"
    implementation "org.slf4j:jul-to-slf4j:$slf4j_version"
}

springBoot {
    mainClass = "com.odat.webserver.ODaTServer"
}

/**
 * Start the OrganChain Spring Boot REST server connected to HospitalA (default).
 * The server always listens on port 8080; the --config.rpc.* args determine which
 * Corda node it connects to via RPC.
 *
 * To connect to a different node, use bootRun with explicit --args instead:
 *   gradlew :clients:bootRun --args="--config.rpc.host=localhost --config.rpc.port=10021 --config.rpc.username=matchingAuth --config.rpc.password=Match@2024"
 *
 * Node → RPC port mapping (from deployNodes in root build.gradle):
 *   HospitalA       10006  hospitalA    HospA@2024
 *   HospitalB       10007  hospitalB    HospB@2024
 *   AdminNode       10012  admin        Admin@2024
 *   Government      10015  govt         Govt@2024
 *   Transporter     10018  transporter  Trans@2024
 *   MatchingAuth    10021  matchingAuth Match@2024
 *
 * NOTE: The Corda node must be running before this task is executed.
 *       /api/match/summary/{id} only returns meaningful data when connected
 *       to the MatchingAuthority node (only it holds the decryption keys).
 */
task runOrganChainServer(type: JavaExec, dependsOn: assemble) {
    group = 'application'
    description = 'Start the OrganChain Spring Boot REST server connected to HospitalA (default).'
    classpath = sourceSets.main.runtimeClasspath
    main = 'com.odat.webserver.ODaTServer'
    args '--server.port=8080',
         '--config.rpc.host=localhost',
         '--config.rpc.port=10006',
         '--config.rpc.username=hospitalA',
         '--config.rpc.password=HospA@2024'
}
